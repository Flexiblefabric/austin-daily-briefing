name: Daily newsletter layout contract
on:
  pull_request:
    paths:
      - "apps-script/DailyNewsletterContract.gs"
      - "apps-script/ResendTransport.gs"
      - "design/newsletter-renderer-qa.html"
      - "design/newsletter-renderer-qa.txt"
      - "scripts/validate_daily_newsletter.js"
      - "scripts/render_daily_newsletter.py"
      - "scripts/daily_newsletter_renderer.js"
      - "tests/daily-newsletter-code-mode.test.js"
      - "apps-script/DailyNewsletterDeliveryQa.gs"
      - "tests/daily-newsletter-controlled-delivery.test.js"
      - "tests/fixtures/daily-newsletter-controlled-send.html"
      - "tests/fixtures/daily-newsletter-controlled-send.txt"
      - "tests/fixtures/daily-newsletter-example.json"
      - "tests/test_daily_newsletter_renderer.py"
      - "tests/daily-newsletter-contract.test.js"
      - ".github/workflows/daily-newsletter-layout.yml"
  push:
    branches: [main]
    paths:
      - "apps-script/DailyNewsletterContract.gs"
      - "apps-script/ResendTransport.gs"
      - "design/newsletter-renderer-qa.html"
      - "design/newsletter-renderer-qa.txt"
      - "scripts/validate_daily_newsletter.js"
      - "tests/daily-newsletter-contract.test.js"
  workflow_dispatch:

jobs:
  renderer-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Structural and dispatch regression tests
        run: node --test tests/daily-newsletter-contract.test.js
      - name: Pure JS renderer integration tests
        run: node --test tests/daily-newsletter-code-mode.test.js
      - name: Synthetic one-recipient QA safety tests
        run: |
          node --test tests/daily-newsletter-controlled-delivery.test.js
          node scripts/validate_daily_newsletter.js tests/fixtures/daily-newsletter-controlled-send.html tests/fixtures/daily-newsletter-controlled-send.txt
      - name: Structured renderer variants
        run: python3 -m unittest discover -s tests -p 'test_daily_newsletter_renderer.py' -v
      - name: Production-reference prequeue check (HTML and text)
        run: node scripts/validate_daily_newsletter.js design/newsletter-renderer-qa.html design/newsletter-renderer-qa.txt
      - name: Deterministic live-layout renderer acceptance
        run: |
          python3 scripts/render_daily_newsletter.py tests/fixtures/daily-newsletter-example.json /tmp/adb-edition.html /tmp/adb-edition.txt
          node scripts/validate_daily_newsletter.js /tmp/adb-edition.html /tmp/adb-edition.txt
