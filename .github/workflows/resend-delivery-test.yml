name: Resend delivery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send one controlled test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADB_TEST_RECIPIENT: ${{ secrets.ADB_TEST_RECIPIENT }}
        run: node scripts/send-resend-test.mjs
